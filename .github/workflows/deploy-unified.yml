name: Deploy Unified App to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'marcas-bpcnehf0g3hshabm'
  AZURE_WEBAPP_PACKAGE_PATH: './publish'
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Preparar Node y compilar Frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React App
        working-directory: ./frontend
        run: npm run build
        env:
          # Para la unificada, la API está en el mismo dominio, por lo que usamos rutas relativas
          VITE_API_URL: '/api'

      # 2. Preparar .NET y compilar Backend
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build and Publish Backend
        run: dotnet publish ./backend/Marcas.API/Marcas.API.csproj -c Release -o ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      # 3. Mover el Frontend dentro del Backend
      - name: Copy Frontend to wwwroot
        run: |
          mkdir -p ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/wwwroot
          cp -r ./frontend/dist/* ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/wwwroot/

      # 4. Empaquetar y desplegar a Azure via Zip Deploy (Kudu API)
      - name: Create deployment zip
        run: |
          cd ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          zip -r ../deploy.zip .
          echo "Zip creado: $(du -sh ../deploy.zip | cut -f1)"

      - name: Deploy to Azure via Zip Deploy
        env:
          KUDU_USER: ${{ secrets.AZURE_KUDU_USER }}
          KUDU_PASSWORD: ${{ secrets.AZURE_KUDU_PASSWORD }}
        run: |
          echo "Desplegando a Azure App Service..."
          HTTP_STATUS=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" \
            -X POST \
            -u "$KUDU_USER:$KUDU_PASSWORD" \
            "https://marcas-bpcnehf0g3hshabm.scm.canadacentral-01.azurewebsites.net/api/zipdeploy?isAsync=false" \
            --data-binary @./deploy.zip \
            -H "Content-Type: application/octet-stream")
          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/deploy_response.txt
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error en el despliegue. Status: $HTTP_STATUS"
            exit 1
          fi
          echo "¡Despliegue exitoso!"

