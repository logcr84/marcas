name: CI — Build & Validate (Deploy automático via Render)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'render.yaml'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20.x'

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Compilar el Frontend
  # ──────────────────────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React App
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: '/api'

  # ──────────────────────────────────────────────────────────────
  # Job 2: Compilar el Backend
  # ──────────────────────────────────────────────────────────────
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & Build Backend
        run: dotnet build ./backend/Marcas.sln -c Release

  # ──────────────────────────────────────────────────────────────
  # NOTA: El deploy a Render se activa automáticamente cuando
  # ambos jobs pasan y el push es al branch main.
  # Render detecta el push al repo y ejecuta el Dockerfile.
  # No se requiere ningún paso adicional de deploy aquí.
  # ──────────────────────────────────────────────────────────────
